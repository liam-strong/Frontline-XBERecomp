# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# src/game/hooks.cpp: mouse look, before the stick rates are added to yaw (player+0x3E8) and pitch (player+0x3EC)
[[hook]]
at = 0x6351A
call = "MouseLook"

# src/game/hooks.cpp: mounted gun aim, before the stick rates are added to gun yaw (player+0x528) and pitch (+0x52C)
[[hook]]
at = 0x62A4B
call = "MountedLook"

# SetFov's ret: widen the horizontal tangent so the 16:9 picture is not a stretched 4:3 view
[[hook]]
at = 0x427BB
call = "SetFov"

# after the save list is filled (esi is the save manager): continue the newest save once the front end asks for it
[[hook]]
at = 0x77CF4
call = "LoadLastSave"

# each present, until that list has been asked for: same continue, once the shell is up and this boot is the menu
[[hook]]
at = 0xE20E0
call = "OfferLastSave"
